<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>声音情绪 · 秦腔脸谱粒子图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #050510;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', '华文楷书', sans-serif;
            color: #eee;
            position: relative;
        }
        canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
        }
        #bg     { z-index: 1; }
        #particles { z-index: 2; cursor: pointer; }

        /* 加载遮罩 */
        #loading {
            position: fixed; inset: 0; z-index: 50;
            background: radial-gradient(circle at center, #1a1228 0%, #03020a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; text-align: center; padding: 24px;
            transition: opacity .6s ease;
        }
        #loading.hide { opacity: 0; pointer-events: none; }
        #loading h1 { font-size: 1.6rem; color: #ffcc99; letter-spacing: 3px; }
        #loading .sub { font-size: 0.95rem; color: #c7b8e0; }
        #loading .bar { width: 280px; max-width: 70vw; height: 6px; background: #2b2240; border-radius: 4px; overflow: hidden; }
        #loading .bar > div { height: 100%; width: 0%; background: linear-gradient(90deg,#ff8855,#ff3a8c); transition: width .25s; }
        #loading .tip { font-size: 0.75rem; color: #8a8aa8; max-width: 360px; line-height: 1.5; }

        /* 麦克风错误提示框（居中模态） */
        #micWarn {
            position: fixed; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            z-index: 60;
            max-width: 520px; width: 90%;
            padding: 24px 28px;
            background: rgba(20, 12, 28, 0.95);
            border: 1px solid #ff6b6b;
            border-radius: 16px;
            box-shadow: 0 16px 48px rgba(255, 80, 80, 0.25);
            color: #ffe2d6;
            display: none;
            font-size: 0.92rem; line-height: 1.6;
            backdrop-filter: blur(10px);
        }
        #micWarn.show { display: block; }
        #micWarn h2 { color: #ff8b6b; font-size: 1.15rem; margin-bottom: 10px; letter-spacing: 1px; }
        #micWarn code {
            background: #1a1228; padding: 2px 8px; border-radius: 4px;
            color: #ffcc99; font-family: 'Consolas', monospace; font-size: 0.88rem;
        }
        #micWarn .cmd {
            display: block; margin: 8px 0; padding: 10px 12px;
            background: #0a0612; border-radius: 6px;
            font-family: 'Consolas', monospace; font-size: 0.85rem; color: #9fd3ff;
            border-left: 3px solid #66aaff;
            user-select: text;
        }
        #micWarn .closeBtn {
            position: absolute; top: 10px; right: 14px; cursor: pointer;
            font-size: 1.4rem; color: #ffaa99; opacity: 0.7;
        }
        #micWarn .closeBtn:hover { opacity: 1; }

        /* HUD 顶部 emoji 切换器 */
        .face-strip {
            display: none;
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 20;
            gap: 8px; padding: 8px 12px;
            background: rgba(8,10,22,0.55);
            border: 1px solid rgba(255,200,120,0.25);
            border-radius: 80px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            font-size: 0.78rem;
        }
        .face-strip .pill {
            padding: 6px 12px; border-radius: 40px;
            color: #d4d4e8; cursor: pointer;
            border: 1px solid transparent;
            transition: all .25s;
            letter-spacing: 1px;
        }
        .face-strip .pill:hover { background: rgba(255,255,255,0.06); }
        .face-strip .pill.active {
            background: linear-gradient(135deg, rgba(255,140,80,0.35), rgba(255,80,140,0.25));
            border-color: rgba(255,200,140,0.7);
            color: #fff7e6;
            text-shadow: 0 0 10px rgba(255,160,80,0.7);
        }

        /* 底部信息面板 */
        .info-panel {
            position: fixed; left: 0; right: 0; bottom: 0;
            z-index: 20;
            display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end;
            padding: 14px 22px 20px;
            background: linear-gradient(to top, rgba(5,6,16,0.92), rgba(5,6,16,0.55) 60%, rgba(5,6,16,0));
            border-top: 1px solid rgba(255,200,120,0.18);
        }
        .panel-block { min-width: 160px; flex: 1; }
        .panel-block.label { letter-spacing: 2px; color: #ffcf9a; font-size: 0.78rem; margin-bottom: 4px; }
        .emotion-area { flex: 2.2; min-width: 200px; }
        .emotion-label { font-size: 0.78rem; letter-spacing: 3px; color: #ffcf9a; }
        .emotion-name {
            font-size: 2.4rem; font-weight: 800;
            background: linear-gradient(90deg, #ffcc66, #ff5577);
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            line-height: 1.1; margin-top: 2px;
            text-shadow: 0 0 22px rgba(255,90,60,0.25);
        }
        .emotion-desc { font-size: 0.8rem; color: #cfd7ea; margin-top: 4px; line-height: 1.4; max-width: 380px; }

        .meter-row { font-size: 0.78rem; color: #cfd7ea; margin: 5px 0; font-family: 'Consolas', monospace; }
        .bar-bg { width: 100%; height: 5px; background: #20243a; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; border-radius: 3px; transition: width .08s linear; }
        .bar-vol  { background: linear-gradient(90deg,#ff884d,#ff3a6f); }
        .bar-pit  { background: linear-gradient(90deg,#66ccff,#9966ff); }
        .bar-bri  { background: linear-gradient(90deg,#ffe27a,#ffaa44); }

        /* 右上角参考脸谱卡片 */
        .face-card {
            position: fixed; top: 76px; right: 22px;
            z-index: 22;
            width: 200px;
            padding: 10px 10px 12px;
            background: rgba(10,8,20,0.55);
            border: 1px solid rgba(255,200,120,0.35);
            border-radius: 14px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
            box-shadow: 0 8px 30px rgba(255,140,80,0.12);
            user-select: none;
        }
        .face-card .label {
            font-size: 0.7rem; letter-spacing: 3px; color: #ffcf9a;
            margin-bottom: 8px; opacity: 0.9;
        }
        .face-card .img-stack {
            position: relative; width: 100%;
            aspect-ratio: 1773 / 2364;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            overflow: hidden;
        }
        .face-card .img-stack img {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity .6s ease, transform .6s ease;
            transform: scale(0.96);
            display: block;
        }
        .face-card .img-stack img.active {
            opacity: 1;
            transform: scale(1);
        }
        .face-card .name {
            font-size: 1.05rem; color: #fff7e6;
            margin-top: 8px; letter-spacing: 4px; font-weight: 600;
            text-shadow: 0 0 12px rgba(255,160,80,0.5);
        }

        .cmd-area { flex: 1; min-width: 180px; text-align: right; }
        .cmd-btn {
            display: inline-block; padding: 9px 16px; border-radius: 40px;
            background: rgba(0,0,0,0.55); border: 1px solid #ffaa66;
            color: #ffdd99; cursor: pointer; font-size: 0.82rem;
            transition: all .2s;
            backdrop-filter: blur(6px);
        }
        .cmd-btn:hover { background: #ffaa33; color: #1f1a2a; transform: translateY(-1px); }
        .status-tip { font-size: 0.72rem; color: #aab3df; margin-top: 8px; }
        .warn-tip { font-size: 0.72rem; color: #ffb37a; margin-top: 6px; }

        @media (max-width: 760px) {
            .info-panel { flex-direction: column; align-items: stretch; text-align: center; }
            .cmd-area   { text-align: center; }
            .emotion-name { font-size: 1.8rem; }
            .face-strip { font-size: 0.7rem; gap: 4px; padding: 6px 8px; }
            .face-strip .pill { padding: 4px 8px; }
            .face-card { width: 110px; top: 60px; right: 10px; padding: 6px 6px 8px; }
            .face-card .label { font-size: 0.6rem; letter-spacing: 1px; margin-bottom: 4px; }
            .face-card .name { font-size: 0.8rem; letter-spacing: 2px; margin-top: 4px; }
        }
    </style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="particles"></canvas>

<div id="micWarn">
    <div class="closeBtn" id="micWarnClose">×</div>
    <h2>🎙️ 麦克风不可用</h2>
    <div id="micWarnBody">
        当前页面无法访问麦克风。
    </div>
</div>

<div id="loading">
    <h1>秦腔脸谱 · 粒子加载中</h1>
    <div class="sub" id="loadSub">准备脸谱素材…</div>
    <div class="bar"><div id="loadBar"></div></div>
    <div class="tip" id="loadTip">第一次进入需读取 7 张脸谱图。<br>建议用本地服务器打开（如 <code>python -m http.server</code>），否则浏览器安全策略会阻止读取像素，将自动切换到兜底显示。</div>
</div>

<div class="face-strip" id="faceStrip"></div>

<div class="face-card" id="faceCard">
    <div class="label">参 考 脸 谱</div>
    <div class="img-stack" id="faceCardStack"></div>
    <div class="name" id="faceCardName">热烈</div>
</div>

<div class="info-panel">
    <div class="emotion-area">
        <div class="emotion-label">🎭 当前情绪 · 秦腔脸谱</div>
        <div class="emotion-name" id="emotionName">🎤 等待声音</div>
        <div class="emotion-desc" id="emotionDesc">点击画面 → 允许麦克风 → 发声触发情绪</div>
    </div>
    <div class="panel-block">
        <div class="meter-row" id="volText">音量 0.00</div>
        <div class="bar-bg"><div class="bar-fill bar-vol" id="volFill"></div></div>
        <div class="meter-row" id="pitchText">音高 —</div>
        <div class="bar-bg"><div class="bar-fill bar-pit" id="pitchFill"></div></div>
        <div class="meter-row" id="brightText">音色 0.00</div>
        <div class="bar-bg"><div class="bar-fill bar-bri" id="brightFill"></div></div>
    </div>
    <div class="cmd-area">
        <div class="cmd-btn" id="resetBtn">🔁 重新开始捕捉</div>
        <div class="status-tip" id="statusTip">点击画面允许麦克风</div>
        <div class="warn-tip" id="warnTip"></div>
    </div>
</div>

    // ============ 画布尺寸 ============
    let W, H, CX, CY, faceW, faceH;
    function updateSize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        for (const c of [bgCanvas, particleCanvas]) {
            c.width  = W * dpr;
            c.height = H * dpr;
            c.style.width  = W + 'px';
            c.style.height = H + 'px';
            c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        CX = W / 2;
        CY = H / 2;
        const aspect = 1773 / 2364; // 素材图统一比例
        faceH = Math.min(H * 0.78, 760);
        faceW = faceH * aspect;
        if (faceW > W * 0.85) { faceW = W * 0.85; faceH = faceW / aspect; }
    }

    // ============ 图片加载 + 像素采样 ============
    let tainted = false; // 浏览器是否阻止画布像素读取

    function loadImage(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            // 注意：对 data:URL 设置 crossOrigin='anonymous' 在部分 Chrome 版本会直接
            // 让图片加载失败（被当成 CORS 请求但 data URL 无 CORS 头）。
            // 我们用的是同源 file:// 或内嵌 data:，都不需要 crossOrigin。
            if (typeof src === 'string' && !src.startsWith('data:')) {
                img.crossOrigin = 'anonymous';
            }
            img.onload = () => resolve(img);
            img.onerror = (e) => reject(e);
            img.src = src;
        });
    }

    // 把图片画到小尺寸 offscreen，跳过白色背景，输出 [{x,y,r,g,b}] 归一化坐标
    function sampleImageToPoints(img, maxSize = 220) {
        const aspect = img.width / img.height;
        let w, h;
        if (aspect >= 1) { w = maxSize; h = Math.round(maxSize / aspect); }
        else            { h = maxSize; w = Math.round(maxSize * aspect); }
        const off = document.createElement('canvas');
        off.width = w; off.height = h;
        const octx = off.getContext('2d', { willReadFrequently: true });
        octx.drawImage(img, 0, 0, w, h);
        let imgData;
        try { imgData = octx.getImageData(0, 0, w, h); }
        catch (e) { throw e; } // 由调用方设置 tainted
        const data = imgData.data;
        const pts = [];
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                if (a < 80) continue;                                    // 透明
                if (r > 235 && g > 235 && b > 235) continue;             // 近白
                const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
                if (mx - mn < 16 && (r+g+b)/3 > 210) continue;           // 灰白
                pts.push({ x: x / w, y: y / h, r, g, b });
            }
        }
        // 洗牌
        for (let i = pts.length - 1; i > 0; i--) {
            const j = (Math.random() * (i + 1)) | 0;
            const t = pts[i]; pts[i] = pts[j]; pts[j] = t;
        }
        return pts;
    }

    async function loadAll() {
        const hasEmbedded = typeof EMBEDDED_IMAGES !== 'undefined';
        for (let i = 0; i < EMOTIONS.length; i++) {
            const e = EMOTIONS[i];
            loadSub.textContent = `加载脸谱 (${i+1}/${EMOTIONS.length})：${e.name}`;
            loadBar.style.width = ((i / EMOTIONS.length) * 100) + '%';
            // 优先用内嵌 base64（Chrome 双击 file:// 也不会被污染），失败再回退到素材文件夹
            const src = (hasEmbedded && EMBEDDED_IMAGES[e.name])
                ? EMBEDDED_IMAGES[e.name]
                : `素材/${encodeURIComponent(e.file)}`;
            try {
                e.img = await loadImage(src);
            } catch (err) {
                console.warn('图片加载失败：', e.name, err);
                e.img = null;
            }
        }
        // 采样
        loadSub.textContent = '采样脸谱像素…';
        for (const e of EMOTIONS) {
            if (!e.img) { e.points = []; continue; }
            try {
                e.points = sampleImageToPoints(e.img, 220);
            } catch (err) {
                console.warn('画布被污染，无法读取像素：', e.file, err);
                tainted = true;
                e.points = [];
            }
        }
        loadBar.style.width = '100%';
        if (tainted) {
            loadTip.innerHTML = '⚠️ 浏览器禁止读取图片像素。已自动切换为「图片淡显 + 情绪色粒子环绕」模式。<br>请确认 HTML 文件未被破坏；或使用 <code>python -m http.server</code> 在本地起服务。';
            warnTip.textContent = '⚠️ 兜底模式：粒子未能解析脸谱图';
        }
    }

    // ============ 粒子系统 ============
    const NUM = 2600;
    const particles = [];
    let currentEmotion = EMOTIONS[0];
    let transitionT = 1;   // 0 = 刚切换, 1 = 稳定
    let bgFadeT = 1;       // 兜底模式下背景图渐变进度

    function initParticles() {
        particles.length = 0;
        for (let i = 0; i < NUM; i++) {
            particles.push({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: 0, vy: 0,
                tx: CX, ty: CY,
                r: 255, g: 200, b: 120,
                size: 1.2 + Math.random() * 2.2,
                idx: i
            });
        }
    }

    function hexToRgb(hex) {
        return {
            r: parseInt(hex.slice(1,3), 16),
            g: parseInt(hex.slice(3,5), 16),
            b: parseInt(hex.slice(5,7), 16)
        };
    }

    function applyEmotionToParticles(e) {
        const x0 = CX - faceW/2, y0 = CY - faceH/2;
        if (e.points && e.points.length > 0) {
            // 粒子模式：每个粒子绑定一个采样点
            const pts = e.points;
            for (let i = 0; i < particles.length; i++) {
                const pt = pts[i % pts.length];
                const p = particles[i];
                p.tx = x0 + pt.x * faceW;
                p.ty = y0 + pt.y * faceH;
                p.r = pt.r; p.g = pt.g; p.b = pt.b;
            }
        } else {
            // 兜底模式：粒子在脸谱框内随机分布，使用情绪色
            const c = hexToRgb(e.color);
            for (const p of particles) {
                p.tx = CX + (Math.random() - 0.5) * faceW * 0.95;
                p.ty = CY + (Math.random() - 0.5) * faceH * 0.95;
                const jr = (Math.random()-0.5) * 60;
                const jg = (Math.random()-0.5) * 60;
                const jb = (Math.random()-0.5) * 60;
                p.r = Math.max(20, Math.min(255, c.r + jr));
                p.g = Math.max(20, Math.min(255, c.g + jg));
                p.b = Math.max(20, Math.min(255, c.b + jb));
            }
        }
    }

    function setEmotion(e, fromUser=false) {
        if (e === currentEmotion) return;
        currentEmotion = e;
        applyEmotionToParticles(e);
        transitionT = 0;
        bgFadeT = 0;
        emotionName.textContent = e.name;
        emotionDesc.textContent = e.desc;
        // 更新顶部 pill 高亮
        [...faceStrip.children].forEach(el => {
            el.classList.toggle('active', el.dataset.name === e.name);
        });
        // 更新右上角参考脸谱图（淡入淡出）
        if (faceCardStack) {
            [...faceCardStack.children].forEach(el => {
                el.classList.toggle('active', el.dataset.name === e.name);
            });
        }
        if (faceCardName) faceCardName.textContent = e.name;
        if (fromUser) {
            classifyVotes.fill(0);
            lastEmotionChange = performance.now();
        }
    }

    // ============ 音频特征 ============
    let audioCtx = null, analyser = null, mediaStream = null;
    let micActive = false;
    let dataT, dataF;
    let curVol = 0, curPitch = 0, curBright = 0, curNoise = 0;
    let pitchHz = 0, lastPitchT = 0;

    function explainMicProblem(err) {
        const noMD = !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia;
        let html = '';
        if (noMD) {
            html += `<p style="color:#ffd49a"><b>原因：</b>当前浏览器不提供 <code>navigator.mediaDevices</code>。</p>`;
            html += `<p style="margin-top:10px"><b>解决：</b>换用最新版 Chrome / Edge / Firefox；或起本地服务器后访问 http://localhost。</p>`;
            html += `<div class="cmd">python -m http.server 8000</div>`;
        } else if (err && err.name === 'NotAllowedError') {
            html += `<p>你拒绝了麦克风权限（或浏览器静默拦截）。请点击地址栏左侧的<b>锁/麦克风</b>图标 → 允许，然后刷新页面。</p>`;
            html += `<p style="margin-top:8px;color:#9fd3ff">Chrome 还可以在 <code>chrome://settings/content/microphone</code> 里检查。</p>`;
        } else if (err && err.name === 'NotFoundError') {
            html += `<p>找不到麦克风设备。请检查系统是否连接了麦克风、且未被其它程序独占。</p>`;
        } else if (err && err.name === 'NotReadableError') {
            html += `<p>麦克风被其它程序占用（如腾讯会议 / OBS / Zoom）。请关闭后重试。</p>`;
        } else {
            html += `<p>麦克风初始化失败：<code>${err && err.name ? err.name + ': ' : ''}${err && err.message ? err.message : err}</code></p>`;
            html += `<p style="margin-top:6px;color:#9fd3ff">如果是 file:// 打开，可尝试 <code>python -m http.server 8000</code> 后访问 http://localhost:8000。</p>`;
        }
        return html;
    }

    async function initMic() {
        // 没有 mediaDevices API（file:// 或不安全上下文）
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            const html = explainMicProblem(null);
            showMicWarn(html);
            statusTip.textContent = '❌ 当前环境无法访问麦克风';
            return;
        }
        try {
            if (audioCtx && audioCtx.state === 'closed') audioCtx = null;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: {
                echoCancellation: false, noiseSuppression: false, autoGainControl: false
            }});
            const src = audioCtx.createMediaStreamSource(mediaStream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.55;
            src.connect(analyser);
            dataT = new Float32Array(analyser.fftSize);
            dataF = new Uint8Array(analyser.frequencyBinCount);
            micActive = true;
            statusTip.textContent = '🎙️ 麦克风已连接 · 试着说/唱出 7 种情绪';
            hideMicWarn();
        } catch (err) {
            console.error('initMic error:', err);
            statusTip.textContent = '❌ 麦克风不可用：' + (err && err.message ? err.message : err);
            showMicWarn(explainMicProblem(err));
        }
    }

    // 自相关音高检测（限定人声范围以加速）
    function autoCorrelatePitch(buf, sr) {
        const N = buf.length;
        let sumSq = 0;
        for (let i = 0; i < N; i++) sumSq += buf[i] * buf[i];
        const rms = Math.sqrt(sumSq / N);
        if (rms < 0.01) return -1;

        const minLag = Math.max(2, Math.floor(sr / 450));   // ~450Hz 上限
        const maxLag = Math.min(N - 1, Math.floor(sr / 70));// ~70Hz 下限
        let bestLag = -1, bestCorr = 0;
        for (let lag = minLag; lag <= maxLag; lag++) {
            let corr = 0;
            const end = N - lag;
            for (let i = 0; i < end; i++) corr += buf[i] * buf[i + lag];
            if (corr > bestCorr) { bestCorr = corr; bestLag = lag; }
        }
        if (bestLag <= 0) return -1;
        // 抛物线插值改善精度
        const y1 = bestLag > minLag ? acAt(buf, bestLag - 1) : bestCorr;
        const y2 = bestCorr;
        const y3 = bestLag < maxLag ? acAt(buf, bestLag + 1) : bestCorr;
        const denom = (2 * (2 * y2 - y1 - y3)) || 1e-9;
        const shift = (y3 - y1) / denom;
        return sr / (bestLag + shift);
    }
    function acAt(buf, lag) {
        let c = 0;
        const end = buf.length - lag;
        for (let i = 0; i < end; i++) c += buf[i] * buf[i + lag];
        return c;
    }

    function detectFeatures() {
        if (!analyser) return;
        if (analyser.getFloatTimeDomainData) analyser.getFloatTimeDomainData(dataT);
        analyser.getByteFrequencyData(dataF);

        // 时域：RMS + 过零率
        let sumSq = 0, zc = 0, prev = 0;
        for (let i = 0; i < dataT.length; i++) {
            const v = dataT[i];
            sumSq += v * v;
            if (i > 0 && ((v >= 0) !== (prev >= 0))) zc++;
            prev = v;
        }
        const rms = Math.sqrt(sumSq / dataT.length);
        const vol = Math.min(1, rms * 4.2);
        const zcr = zc / dataT.length;

        // 音高（节流：每 ~60ms 算一次，避免卡顿）
        const now = performance.now();
        if (now - lastPitchT > 60) {
            if (vol > 0.025) {
                const p = autoCorrelatePitch(dataT, audioCtx.sampleRate);
                if (p > 0 && p < 800) {
                    pitchHz = pitchHz === 0 ? p : (pitchHz * 0.55 + p * 0.45);
                }
            } else {
                pitchHz *= 0.92;
            }
            lastPitchT = now;
        }
        // 80~450Hz 对数归一
        const pitchNorm = pitchHz > 60
            ? Math.max(0, Math.min(1, Math.log2(pitchHz / 80) / Math.log2(450 / 80)))
            : 0;

        // 频域：质心（音色亮度）
        let total = 0, weighted = 0;
        for (let i = 0; i < dataF.length; i++) {
            total += dataF[i];
            weighted += dataF[i] * i;
        }
        const centroid = total === 0 ? 0 : weighted / total / dataF.length;
        const bright = Math.min(1, centroid * 2.6);

        // 噪声：高 ZCR + 谱平坦度近似
        const noise = Math.min(1, zcr * 3.2);

        // 平滑
        const a = 0.18;
        curVol    = curVol    * (1 - a) + vol       * a;
        curPitch  = curPitch  * (1 - a) + pitchNorm * a;
        curBright = curBright * (1 - a) + bright    * a;
        curNoise  = curNoise  * (1 - a) + noise     * a;
    }

    // ============ 情绪分类（加权距离 + 投票防抖） ============
    const classifyVotes = new Array(EMOTIONS.length).fill(0);
    let lastEmotionChange = 0;

    function classifyEmotion() {
        if (curVol < 0.045) {
            for (let i = 0; i < classifyVotes.length; i++) classifyVotes[i] *= 0.9;
            return;
        }
        // 加权距离
        let bestIdx = 0, bestScore = -Infinity;
        for (let i = 0; i < EMOTIONS.length; i++) {
            const e = EMOTIONS[i];
            const dv = curVol - e.vol;
            const dp = curPitch - e.pitch;
            const db = curBright - e.bright;
            const dn = curNoise - e.noise;
            // 音量与音高最关键，其次噪声、亮度
            const dist = dv*dv*3.2 + dp*dp*2.2 + dn*dn*1.6 + db*db*0.9;
            const score = -dist;
            if (score > bestScore) { bestScore = score; bestIdx = i; }
        }
        // 投票
        for (let i = 0; i < classifyVotes.length; i++) classifyVotes[i] *= 0.93;
        classifyVotes[bestIdx] += 1.0;

        // 当前赢家
        let maxV = 0, maxI = 0;
        for (let i = 0; i < classifyVotes.length; i++) {
            if (classifyVotes[i] > maxV) { maxV = classifyVotes[i]; maxI = i; }
        }
        const now = performance.now();
        if (EMOTIONS[maxI] !== currentEmotion && maxV > 6 && now - lastEmotionChange > 1200) {
            setEmotion(EMOTIONS[maxI]);
            lastEmotionChange = now;
        }
    }

    // ============ 渲染 ============
    function drawBackground() {
        // 渐变底
        const g = bgCtx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.75);
        g.addColorStop(0, '#181028');
        g.addColorStop(1, '#03020a');
        bgCtx.fillStyle = g;
        bgCtx.fillRect(0, 0, W, H);
        // 兜底模式：把脸谱图轻轻画在背景里
        if (tainted && currentEmotion.img) {
            const x0 = CX - faceW/2, y0 = CY - faceH/2;
            bgCtx.save();
            bgCtx.globalAlpha = 0.18 + bgFadeT * 0.17 + curVol * 0.15;
            bgCtx.drawImage(currentEmotion.img, x0, y0, faceW, faceH);
            bgCtx.restore();
        }
    }

    function drawParticles() {
        // 拖尾
        pCtx.fillStyle = 'rgba(5,5,15,0.22)';
        pCtx.fillRect(0, 0, W, H);

        transitionT = Math.min(1, transitionT + 0.012);
        bgFadeT     = Math.min(1, bgFadeT + 0.01);

        const stiff = 0.05 * (0.4 + transitionT * 0.6);
        const damp  = 0.82;
        const jitterBase = 0.35 + curVol * 3.6 + curNoise * 1.6;
        const sizeBoost  = 1 + curVol * 0.9;

        for (const p of particles) {
            const dx = p.tx - p.x, dy = p.ty - p.y;
            p.vx += dx * stiff;
            p.vy += dy * stiff;
            p.vx *= damp;
            p.vy *= damp;
            p.vx += (Math.random() - 0.5) * jitterBase;
            p.vy += (Math.random() - 0.5) * jitterBase;
            p.x += p.vx;
            p.y += p.vy;

            const dist = Math.hypot(dx, dy);
            const focus = Math.max(0.3, 1 - dist / 90);
            const alpha = 0.55 + curVol * 0.4 + (1 - transitionT) * 0.2;
            const sz = p.size * sizeBoost * (0.55 + 0.65 * focus);
            pCtx.fillStyle = `rgba(${p.r|0},${p.g|0},${p.b|0},${alpha.toFixed(3)})`;
            pCtx.beginPath();
            pCtx.arc(p.x, p.y, sz, 0, Math.PI * 2);
            pCtx.fill();
        }
    }

    function frame() {
        if (micActive) {
            detectFeatures();
            classifyEmotion();
            // HUD
            volFill.style.width    = (curVol    * 100).toFixed(1) + '%';
            pitchFill.style.width  = (curPitch  * 100).toFixed(1) + '%';
            brightFill.style.width = (curBright * 100).toFixed(1) + '%';
            volText.textContent    = `音量 ${curVol.toFixed(2)}`;
            pitchText.textContent  = pitchHz > 60 ? `音高 ${pitchHz.toFixed(0)} Hz` : `音高 —`;
            brightText.textContent = `音色 ${curBright.toFixed(2)}`;
        }
        drawBackground();
        drawParticles();
        requestAnimationFrame(frame);
    }

    // ============ 顶部脸谱切换 pill ============
    function buildFaceStrip() {
        faceStrip.innerHTML = '';
        for (const e of EMOTIONS) {
            const pill = document.createElement('div');
            pill.className = 'pill';
            pill.textContent = e.name;
            pill.dataset.name = e.name;
            pill.title = e.desc;
            pill.addEventListener('click', (ev) => {
                ev.stopPropagation();
                setEmotion(e, true);
            });
            faceStrip.appendChild(pill);
        }
        [...faceStrip.children].forEach(el => {
            el.classList.toggle('active', el.dataset.name === currentEmotion.name);
        });
    }

    // ============ 右上角参考脸谱卡片：构建 7 张图栈 ============
    function buildFaceCard() {
        if (!faceCardStack) return;
        faceCardStack.innerHTML = '';
        for (const e of EMOTIONS) {
            const img = document.createElement('img');
            // 用 素材/png/<情绪名>.png；浏览器对 <img src> 的 file:// 加载不受 CORS 限制
            img.src = `素材/png/${encodeURIComponent(e.name)}.png`;
            img.alt = e.name;
            img.dataset.name = e.name;
            img.loading = 'eager';
            img.draggable = false;
            // 图加载失败时退回内嵌 base64（如果有）
            img.onerror = () => {
                if (typeof EMBEDDED_IMAGES !== 'undefined' && EMBEDDED_IMAGES[e.name]) {
                    img.src = EMBEDDED_IMAGES[e.name];
                }
            };
            if (e.name === currentEmotion.name) img.classList.add('active');
            faceCardStack.appendChild(img);
        }
        faceCardName.textContent = currentEmotion.name;
    }

    // ============ 重置 ============
    function fullReset() {
        classifyVotes.fill(0);
        pitchHz = 0;
        curVol = curPitch = curBright = curNoise = 0;
        setEmotion(EMOTIONS[0]);
        statusTip.textContent = '🔁 已重置 · 请重新发声';
        setTimeout(() => {
            if (micActive) statusTip.textContent = '🎙️ 麦克风已连接 · 试着说/唱出 7 种情绪';
        }, 1600);
    }

    // ============ 语音指令 ============
    function initVoiceCmd() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;
        try {
            const rec = new SR();
            rec.continuous = true;
            rec.lang = 'zh-CN';
            rec.interimResults = false;
            rec.onresult = (e) => {
                const t = e.results[e.results.length - 1][0].transcript;
                if (t.includes('重新开始') || t.includes('重新捕捉')) fullReset();
            };
            rec.onerror = () => {};
            rec.onend = () => { try { rec.start(); } catch(_) {} };
            rec.start();
        } catch (_) { /* 浏览器不支持就静默 */ }
    }

    // ============ 事件 ============
    window.addEventListener('resize', () => {
        updateSize();
        applyEmotionToParticles(currentEmotion);
    });
    // 点击页面任意位置都尝试启动麦克风（HUD 与脸谱条上的按钮自己 stopPropagation）
    document.addEventListener('click', () => {
        if (!micActive) initMic();
        else if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    });
    resetBtn.addEventListener('click', (e) => { e.stopPropagation(); fullReset(); });

    // ============ 启动 ============
    (async function start() {
        updateSize();
        initParticles();
        try {
            await loadAll();
        } catch (err) {
            console.error(err);
        }
        setTimeout(() => loading.classList.add('hide'), 400);
        buildFaceStrip();
        buildFaceCard();
        applyEmotionToParticles(currentEmotion);
        emotionName.textContent = '🎤 点击屏幕开始';
        emotionDesc.textContent = '允许麦克风后发声，粒子会聚合成对应秦腔脸谱';
        statusTip.textContent = tainted ? '点击画面允许麦克风（兜底模式）' : '点击画面允许麦克风';
        frame();
        initVoiceCmd();

        // 只在真的没有 mediaDevices API 时才提前警告；file:// 在 Chrome 中其实是允许的
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showMicWarn(explainMicProblem(null));
            statusTip.textContent = '❌ 当前浏览器/环境不支持 mediaDevices';
        }
    })();

})();
</script>
</body>
</html>
